# Respaldo opcional del monitor externo: comprueba /api/health cada 15 minutos.
# Si el API no responde 200 (Redis caído o datos sin actualizar), el workflow falla y
# GitHub te avisa por correo. Requiere la variable de repositorio API_URL
# (Settings → Secrets and variables → Actions → Variables), p. ej. https://mi-api.onrender.com
#
# Limitaciones: el mínimo de GitHub es de 5 min, los retrasos son habituales y los
# workflows programados se desactivan tras 60 días sin actividad en el repositorio.
name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar /api/health
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::notice::Define la variable de repositorio API_URL para activar esta comprobación."
            exit 0
          fi
          # Reintenta: tras dormir, Render tarda 30-60 s en responder.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 "${API_URL%/}/api/health"
