# Blueprint de Render: https://render.com/docs/blueprint-spec
# Despliegue gratuito del API. Redis va aparte (Upstash, plan gratuito): ver docs/HOSTING.md
services:
  - type: web
    name: castellon-comercio-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    healthCheckPath: /api/status
    envVars:
      # PORT lo inyecta Render; el API lo lee de process.env.PORT
      - key: NODE_ENV
        value: prod # db 0 de Redis (Upstash solo ofrece la 0)
      - key: TRUST_PROXY
        value: "1" # Render pone un proxy delante: necesario para el rate limit
      - key: REDIS_URL
        sync: false # rediss://default:PASSWORD@HOST:6379 (Upstash)
      - key: REDIS_NAMESPACE
        value: bonos2026 # cambia por edición para no mezclar datos
      - key: MAIL_ENABLED
        value: "false" # pon "true" cuando el SMTP esté configurado
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_SECURE
        value: "true"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false # contraseña de aplicación de Google
      - key: MAIL_TO
        sync: false
      - key: FRONTEND_URL
        sync: false # URL pública del front (se usa en el email)
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
